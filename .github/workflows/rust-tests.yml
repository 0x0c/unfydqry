name: Rust Tests

on:
  # Always trigger so the test check reports on every push/PR (required-check
  # friendly). Path relevance is decided per-job below: when nothing relevant
  # changed, the test job is skipped, which counts as a passing required check.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            run:
              - "core/**"
              - "spec/**"
              - ".github/workflows/rust-tests.yml"

  rust-test:
    name: cargo test on ubuntu-latest
    needs: changes
    # workflow_dispatch has no diff to filter on, so always run when dispatched.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: cargo fmt --check
        working-directory: core
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: core
        run: cargo test --all-targets
